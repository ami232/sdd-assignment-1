<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organiser · Ski Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <!-- A small gondola gliding slowly along a cobalt cable. -->
            <svg viewBox="0 0 100 40" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 10 L98 4" stroke="#2f5bbf" stroke-width="2"/>
                <g class="cabin">
                    <path d="M16 9 V15" stroke="#1f2d3d" stroke-width="2"/>
                    <rect x="6" y="15" width="20" height="19" rx="5" fill="#d9472f"/>
                    <rect x="9" y="18" width="14" height="6" rx="2" fill="#f7f1e8"/>
                    <path d="M16 18 V34" stroke="#1f2d3d" stroke-width="1.5"/>
                </g>
            </svg>
            Ski <span>Club</span></a>
        <nav>
            <a href="organiser.html" class="active">Organiser</a>
            <a href="my-trip.html">My trip</a>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">Organiser</p>
            <h1>Your trips</h1>
            <p class="muted">Places, payments and waiting lists for every trip this season.</p>
        </section>

        <div id="message" hidden></div>

        <section class="section">
            <div class="grid" id="trips"></div>
        </section>

        <section class="section">
            <h2>Create a trip</h2>
            <div class="panel">
                <form id="create-trip">
                    <label>Trip name <input name="name" placeholder="Andorra 2027" required></label>
                    <label>Destination <input name="destination" placeholder="Grandvalira" required></label>
                    <label>Start date <input type="date" name="start_date" required></label>
                    <label>End date <input type="date" name="end_date" required></label>
                    <label>Places <input type="number" name="capacity" min="1" placeholder="150" required></label>
                    <button type="submit">Create trip</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">Ski Club · Trips, places and rooms for the university ski club</footer>

    <script src="common.js"></script>
    <script src="organiser.js"></script>
</body>
</html>
